<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mockupstream</title>
<script defer src="/vendor/alpine.min.js"></script>
<style>
  @font-face { font-family:"JetBrains Mono"; src:url("/vendor/jetbrains-mono/JetBrainsMono-Regular.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:swap; }
  @font-face { font-family:"JetBrains Mono"; src:url("/vendor/jetbrains-mono/JetBrainsMono-Medium.woff2") format("woff2"); font-weight:500; font-style:normal; font-display:swap; }
  @font-face { font-family:"JetBrains Mono"; src:url("/vendor/jetbrains-mono/JetBrainsMono-SemiBold.woff2") format("woff2"); font-weight:600; font-style:normal; font-display:swap; }
  :root {
    --bg:#1e1f22; --panel:#2b2d30; --panel-2:#313335; --floor:#1e1f22;
    --border:#393b40; --border-soft:#33353a;
    --fg:#dfe1e5; --mut:#8b8f97;
    --accent:#3574f0; --accent-ink:#ffffff; --accent-soft:rgba(53,116,240,.14); --accent-fg:#7aa4f7;
    --ok:#499c54; --warn:#d4a02b; --err:#db5c5c; --gemini:#a177f4;
    --v-openai:#10a37f; --v-claude:#d97757; --v-gemini:#a177f4; --v-deepseek:#1e88e5;
    --v-kimi:#8bc34a; --v-glm:#26c6da; --v-qwen:#e8a33d; --v-hunyuan:#7986cb;
    --v-mistral:#fa520f; --v-grok:#c9cdd3; --v-llama:#96786c; --v-minimax:#e73562; --v-ernie:#fbc02d;
    --v-mimo:#8d97a5;
    --radius:5px;
  }
  * { box-sizing:border-box; }
  html { font-size:15px; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"JetBrains Mono",ui-monospace,"Cascadia Code","SFMono-Regular",Consolas,monospace;
    font-size:12.5px; line-height:1.6;
  }

  /* ---------- top toolbar ---------- */
  .toolbar { height:38px; display:flex; align-items:center; gap:9px; padding:0 14px; background:var(--panel); border-bottom:1px solid var(--border); }
  .toolbar .apptitle { font-size:12px; font-weight:600; color:var(--fg); white-space:nowrap; overflow:hidden; }
  .toolbar .typed { color:var(--mut); font-weight:400; }
  .toolbar .appmeta { color:var(--mut); font-size:11px; margin-left:auto; }
  .toolbar .prompt { color:var(--accent); font-weight:600; }
  .toolbar .path { color:var(--mut); margin-right:6px; }
  .toolbar .promptcursor { display:inline-block; width:6px; height:12px; background:var(--accent); vertical-align:-2px; margin-left:3px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .promptcursor { animation:none; } }
  .logout-btn { background:transparent; border:1px solid var(--border); color:var(--mut); padding:3px 10px; font-size:11px; border-radius:var(--radius); }
  .logout-btn:hover { color:var(--err); border-color:var(--err); background:rgba(219,92,86,.08); }

  /* ---------- bottom status bar (signature) ---------- */
  .statusbar { height:24px; display:flex; align-items:stretch; background:var(--panel); border-top:1px solid var(--border); font-size:10.5px; color:var(--mut); }
  .statusbar .seg { padding:0 11px; display:flex; align-items:center; gap:6px; border-right:1px solid var(--border-soft); }
  .statusbar .seg:last-child { border-right:none; margin-left:auto; }
  .statusbar .dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .statusbar .dot.ok { background:var(--ok); }
  .statusbar .dot.warn { background:var(--warn); }
  .statusbar .dot.info { background:var(--accent); }

  /* ---------- layout ---------- */
  .layout { display:grid; grid-template-columns:236px 1fr; height:calc(100vh - 38px - 24px); }
  .side { background:var(--panel); border-right:1px solid var(--border); padding:10px; overflow:auto; }
  .side .panel-title { font-size:10px; color:var(--mut); text-transform:uppercase; letter-spacing:.08em; font-weight:600; padding:6px 6px 8px; }
  .main { overflow:auto; background:var(--bg); display:flex; flex-direction:column; min-height:0; }

  /* ---------- buttons / inputs ---------- */
  button { cursor:pointer; border:1px solid var(--border); background:var(--panel-2); color:var(--fg);
           padding:6px 13px; border-radius:var(--radius); font-size:12px; font-family:inherit; }
  button:hover { background:#3a3c40; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:500; }
  button.primary:hover { background:#4682f5; }
  button.sm { padding:4px 9px; font-size:11px; }
  button.danger { color:var(--err); }
  button.danger:hover { border-color:var(--err); background:rgba(219,92,86,.1); }
  button:disabled { opacity:.4; cursor:default; }
  input, select, textarea { width:100%; background:var(--floor); color:var(--fg); border:1px solid var(--border);
          border-radius:var(--radius); padding:6px 9px; font:12px "JetBrains Mono",ui-monospace,Consolas,monospace; }
  textarea { resize:vertical; min-height:50px; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  ::placeholder { color:var(--mut); }
  /* 原生 number 上下调节按钮跟着系统/浏览器主题走颜色，在这套深色 UI 里经常显得很突兀(比如粉色)，直接去掉，
     跟其余控件保持同一套自绘风格；输入数字/方向键/滚轮改值照常可用，只是没有那两个小箭头了。 */
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .row { display:grid; grid-template-columns:150px 1fr; gap:10px; align-items:center; margin-bottom:9px; }
  .row label { color:var(--mut); font-size:12px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btns { display:flex; gap:8px; margin-top:6px; }
  .hint { color:var(--mut); font-size:11.5px; margin-top:8px; line-height:1.6; }

  /* ---------- sidebar: project tool window ---------- */
  .sidebtns { display:flex; gap:6px; margin-bottom:10px; }
  .search { margin-bottom:10px; font-size:12px; }
  .mgroup { margin-bottom:4px; }
  .mgroup-head { display:flex; align-items:center; gap:6px; padding:5px 6px; cursor:pointer; color:var(--mut); font-size:11px; border-radius:var(--radius); user-select:none; }
  .mgroup-head:hover { background:var(--panel-2); color:var(--fg); }
  .mgroup-arrow { width:9px; display:inline-block; font-size:9px; }
  .mgroup-count { margin-left:auto; }
  .mrow { display:flex; align-items:center; gap:7px; padding:5px 8px 5px 21px; border-radius:var(--radius); cursor:pointer; font-size:12px; color:var(--fg); }
  .mrow:hover { background:var(--panel-2); }
  .mrow.active { background:var(--accent-soft); box-shadow:inset 2px 0 0 var(--accent); }
  .mrow .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vendor-icon { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; flex-shrink:0; color:var(--mut); }
  .vendor-icon svg { width:14px; height:14px; }
  .vendor-icon.openai { color:var(--v-openai); } .vendor-icon.claude { color:var(--v-claude); } .vendor-icon.gemini { color:var(--v-gemini); }
  .vendor-icon.deepseek { color:var(--v-deepseek); } .vendor-icon.kimi { color:var(--v-kimi); } .vendor-icon.glm { color:var(--v-glm); }
  .vendor-icon.qwen { color:var(--v-qwen); } .vendor-icon.hunyuan { color:var(--v-hunyuan); } .vendor-icon.mistral { color:var(--v-mistral); }
  .vendor-icon.grok { color:var(--v-grok); } .vendor-icon.llama { color:var(--v-llama); } .vendor-icon.minimax { color:var(--v-minimax); }
  .vendor-icon.ernie { color:var(--v-ernie); }
  .vendor-icon.mimo { color:var(--v-mimo); }
  .vendor-icon.custom-openai { color:var(--v-openai); } .vendor-icon.custom-claude { color:var(--v-claude); } .vendor-icon.custom-gemini { color:var(--v-gemini); }
  .vendor-picker { display:flex; align-items:center; gap:8px; }
  .vendor-picker select { flex:1; min-width:0; }
  .fmt { font-size:10px; padding:1px 6px; border-radius:3px; font-weight:600; }
  .fmt.openai { background:rgba(53,116,240,.15); color:var(--accent-fg); }
  .fmt.claude { background:rgba(212,160,43,.15); color:var(--warn); }
  .fmt.gemini { background:rgba(161,119,244,.15); color:var(--gemini); }

  /* ---------- cards ---------- */
  .card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px; }
  .card h2 { font-size:12.5px; margin:0 0 3px; color:var(--fg); font-weight:600; }
  .card .card-sub { color:var(--mut); font-size:11px; margin:0 0 14px; font-weight:400; }
  .hint code, .card-sub code { background:var(--floor); border:1px solid var(--border-soft); border-radius:3px; padding:1px 5px; color:var(--accent-fg); font-size:11px; }
  .tutorial-step { display:flex; gap:12px; padding:14px 0; border-top:1px solid var(--border-soft); }
  .tutorial-step:first-of-type { border-top:none; padding-top:4px; }
  .tutorial-step-num { width:22px; height:22px; border-radius:50%; background:var(--accent-soft); color:var(--accent-fg);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
  .tutorial-step-title { font-size:12.5px; font-weight:600; color:var(--fg); margin-bottom:4px; }
  .tutorial-code { background:var(--floor); border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px;
    font-size:11.5px; color:var(--accent-fg); overflow:auto; margin:8px 0 0; white-space:pre; font-family:inherit; }

  /* ---------- editor-style tabs ---------- */
  .tabbar { display:flex; background:var(--panel); border-bottom:1px solid var(--border); flex-shrink:0; }
  .tabbar button { background:transparent; border:none; border-right:1px solid var(--border-soft); color:var(--mut);
                   padding:9px 16px; border-radius:0; font-size:12px; position:relative; }
  .tabbar button:hover { color:var(--fg); background:var(--panel-2); }
  .tabbar button.active { color:var(--fg); background:var(--bg); font-weight:500; }
  .tabbar button.active::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--accent); }
  .tabcontent { padding:18px 22px; overflow:auto; flex:1; }

  .warnbar { border:1px solid var(--warn); border-left:3px solid var(--warn); background:rgba(212,160,43,.08); color:var(--fg);
             border-radius:var(--radius); padding:9px 13px; font-size:12px; margin-bottom:16px; }
  .warnbar b { color:var(--warn); }

  /* ---------- endpoint rows ---------- */
  .ep { font-family:inherit; font-size:12px; background:var(--floor); border:1px solid var(--border); border-radius:var(--radius);
        padding:6px 10px; display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .ep code { flex:1; overflow:auto; white-space:nowrap; color:var(--accent-fg); }
  .field-label { color:var(--mut); font-size:11px; margin:14px 0 6px; text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .field-label:first-child { margin-top:0; }

  table { width:100%; border-collapse:collapse; font-size:11.5px; }
  td, th { text-align:left; padding:5px 7px; border-bottom:1px solid var(--border-soft); }
  th { color:var(--mut); font-weight:600; text-transform:uppercase; font-size:10px; letter-spacing:.04em; }
  .pill { display:inline-block; padding:1px 7px; border-radius:9px; font-size:10.5px; font-weight:600; }
  .pill.err { background:rgba(219,92,86,.15); color:var(--err); } .pill.ok { background:rgba(73,156,84,.15); color:var(--ok); }

  /* ---------- trust policy cards ---------- */
  .policy-card { border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; background:var(--floor); }
  .policy-card .policy-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .policy-card .policy-head b { color:var(--fg); font-size:12.5px; }
  .policy-chip { padding:2px 9px; border-radius:9px; font-weight:600; font-size:10px; letter-spacing:.02em; }
  .policy-chip.allow-all { background:rgba(73,156,84,.15); color:var(--ok); }
  .policy-chip.deny-all { background:rgba(219,92,86,.15); color:var(--err); }
  .policy-chip.whitelist { background:rgba(53,116,240,.15); color:var(--accent-fg); }
  .policy-chip.blacklist { background:rgba(212,160,43,.15); color:var(--warn); }
  .mode-switch { display:flex; gap:4px; margin:10px 0; }
  .mode-switch button { flex:1; font-size:10.5px; padding:6px 4px; }
  .mode-switch button.active.allow-all { background:var(--ok); border-color:var(--ok); color:#0e2012; }
  .mode-switch button.active.deny-all { background:var(--err); border-color:var(--err); color:#2a0a09; }
  .mode-switch button.active.whitelist { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .mode-switch button.active.blacklist { background:var(--warn); border-color:var(--warn); color:#2a1c04; }

  /* ---------- toast ---------- */
  .toast { position:fixed; right:16px; bottom:34px; background:var(--panel-2); border:1px solid var(--border); border-left:3px solid var(--ok);
           color:var(--fg); padding:9px 14px; border-radius:var(--radius); opacity:0; transform:translateY(4px);
           transition:opacity .15s, transform .15s; font-size:12px; z-index:1001; box-shadow:0 4px 16px rgba(0,0,0,.3); }
  .toast.show { opacity:1; transform:translateY(0); }

  /* ---------- confirm dialog (real IDE dialog convention) ---------- */
  .confirm-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:1002; }
  .confirm-box { background:var(--panel); border:1px solid var(--border); border-radius:6px; min-width:320px; max-width:420px; box-shadow:0 8px 32px rgba(0,0,0,.45); }
  .confirm-titlebar { padding:11px 16px; border-bottom:1px solid var(--border); font-size:12px; font-weight:600; color:var(--fg); }
  .confirm-body { padding:16px; font-size:12px; color:var(--fg); word-break:break-all; }
  .confirm-actions { padding:12px 16px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }
  [x-cloak] { display:none !important; }

  ::selection { background:var(--accent); color:var(--accent-ink); }
  :focus-visible { outline:1px solid var(--accent); outline-offset:1px; }
</style>
</head>
<body x-data="app()" x-init="init()">
<div class="toolbar">
  <span class="apptitle"><span class="prompt">mockupstream</span><span class="path">@panel:~$</span> <span class="typed" x-text="promptText"></span><span class="promptcursor"></span></span>
  <span class="appmeta" x-text="origin"></span>
  <button class="logout-btn" x-show="auth.authenticated" @click="logout()">Log Out</button>
</div>

<div class="layout">
  <!-- 左：Project 工具窗口(模型列表) -->
  <div class="side">
    <div class="panel-title">Project</div>
    <div class="sidebtns">
      <button class="sm primary" @click="openNewModelDialog()">+ New</button>
      <button class="sm" @click="dupModel()" :disabled="!sel">Copy</button>
      <button class="sm danger" @click="delModel()" :disabled="!sel">Delete</button>
    </div>
    <input class="search" x-model="modelSearch" placeholder="Search models…" />
    <template x-for="group in groupedModels()" :key="group.vendor">
      <div class="mgroup">
        <div class="mgroup-head" @click="toggleGroup(group.vendor)">
          <span class="mgroup-arrow" x-text="collapsedGroups[group.vendor] ? '▸' : '▾'"></span>
          <span class="vendor-icon" :class="group.vendor" x-html="vendorIcon(group.vendor)"></span>
          <span x-text="VENDOR_LABELS[group.vendor] || group.vendor"></span>
          <span class="mgroup-count" x-text="group.items.length"></span>
        </div>
        <template x-if="!collapsedGroups[group.vendor]">
          <div>
            <template x-for="m in group.items" :key="m.id">
              <div class="mrow" :class="{active: sel && sel.id===m.id}" @click="select(m.id)">
                <span class="name" x-text="m.id"></span>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>
    <div class="hint" x-show="!groupedModels().length" style="margin-top:0">No matching models</div>
  </div>

  <!-- 右：Tab + 内容 -->
  <div class="main">
    <div class="tabbar">
      <button :class="{active: tab==='tutorial'}" @click="tab='tutorial'">Tutorial</button>
      <button :class="{active: tab==='models'}" @click="tab='models'">Models</button>
      <button :class="{active: tab==='presets'}" @click="tab='presets'">Presets</button>
      <button :class="{active: tab==='channels'}" @click="tab='channels'">Channels</button>
      <button :class="{active: tab==='recent'}" @click="tab='recent'">Recent Requests</button>
      <button :class="{active: tab==='network'}" @click="tab='network'">Network &amp; Security</button>
    </div>

    <div class="tabcontent">
      <div class="warnbar" x-show="!auth.passwordSet">
        <b>No password set.</b> 任何能访问这个页面的人都可以修改所有配置。要给局域网/公网同事用之前，先去 Network &amp; Security 设一个。
      </div>

      <!-- ===== tutorial ===== -->
      <template x-if="tab==='tutorial'">
        <div>
        <div class="card">
          <h2>New-API 界面配置教程</h2>
          <div class="card-sub">在 new-api 的浏览器管理后台里，按顺序做完这 5 步，就能把这个 mock 当真实上游用。</div>

          <div class="tutorial-step">
            <div class="tutorial-step-num">1</div>
            <div class="tutorial-step-body">
              <div class="tutorial-step-title">登录 new-api 后台</div>
              <div class="hint" style="margin-top:0">浏览器打开 new-api 前端，用 <code>root</code> 账号 + 首次启动时生成的密码登录。</div>
            </div>
          </div>

          <div class="tutorial-step">
            <div class="tutorial-step-num">2</div>
            <div class="tutorial-step-body">
              <div class="tutorial-step-title">建渠道（Channels）</div>
              <div class="hint" style="margin-top:0">
                类型选 <b>OpenAI</b>；代理 / Base URL 填 <b>Network &amp; Security</b> 标签页里对应的一条（本机 / Docker / 局域网 / 公网，看 new-api 部署在哪）；
                密钥随便填，比如 <code>sk-mock</code>；模型列表填 <code>gpt-3.5-turbo,gpt-4o</code>（或你在 Models 标签页建的模型名）。
                保存后点「测试」，mock 的 <code>/v1/models</code> 会响应。
              </div>
            </div>
          </div>

          <div class="tutorial-step">
            <div class="tutorial-step-num">3</div>
            <div class="tutorial-step-body">
              <div class="tutorial-step-title">配模型倍率</div>
              <div class="hint" style="margin-top:0">运营设置 / 模型倍率里，确保渠道里填的每个模型名都配了对应倍率，不然计费算不出来。</div>
            </div>
          </div>

          <div class="tutorial-step">
            <div class="tutorial-step-num">4</div>
            <div class="tutorial-step-body">
              <div class="tutorial-step-title">建令牌（Tokens）</div>
              <div class="hint" style="margin-top:0">新建一个令牌，复制出 <code>sk-xxx</code>——发请求时带 <code>Authorization: Bearer sk-xxx</code> 用的就是它。</div>
            </div>
          </div>

          <div class="tutorial-step">
            <div class="tutorial-step-num">5</div>
            <div class="tutorial-step-body">
              <div class="tutorial-step-title">修改 TierGroups（按需分层，可选）</div>
              <div class="hint" style="margin-top:0">系统设置 → 倍率设置 → TierGroups：</div>
              <pre class="tutorial-code">{
  "dev": {"groups": ["default"]},
  "pro": {"groups": ["default", "vip"]},
  "ent": {"groups": ["default", "vip", "svip"]}
}</pre>
            </div>
          </div>
        </div>

        <div class="card">
          <h2>直接发请求（不经过 new-api）</h2>
          <div class="card-sub">跳过 new-api，直接拿 curl 打这个 mock 自己，调试模型配置最快。</div>
          <div class="hint" style="margin-top:0">
            <code>Authorization: Bearer sk-xxx</code> 里的 <code>sk-xxx</code> 这个 mock <b>完全不校验</b>——随便填一个字符串（比如 <code>sk-mock</code>），甚至不带这个头也一样能打通。
            这一层"鉴权"是 new-api 自己做的，跟直接打 mock 没关系；mock 只负责按你在 Models 标签页配的档案伪造响应。
          </div>
          <div class="tutorial-step-title" style="margin-top:14px">Bash / macOS / Linux</div>
          <pre class="tutorial-code">curl http://localhost:8788/v1/chat/completions \
  -H "Authorization: Bearer sk-mock" \
  -H "Content-Type: application/json" \
  -d '{"model":"gpt-3.5-turbo","messages":[{"role":"user","content":"测试"}]}'</pre>
          <div class="tutorial-step-title" style="margin-top:14px">PowerShell</div>
          <div class="hint" style="margin-top:0">
            PowerShell 里 <code>curl</code> 默认是 <code>Invoke-WebRequest</code> 的别名，<code>-H</code> 参数语法跟真 curl 不一样，直接抄 Bash 那份命令会报参数绑定错误。两种解法：
          </div>
          <pre class="tutorial-code">curl.exe http://localhost:8788/v1/chat/completions `
  -H "Authorization: Bearer sk-mock" `
  -H "Content-Type: application/json" `
  -d "{\"model\":\"gpt-3.5-turbo\",\"messages\":[{\"role\":\"user\",\"content\":\"测试\"}]}"</pre>
          <div class="hint" style="margin-top:0">或者用原生 PowerShell 语法（<code>Invoke-RestMethod</code> 会自动把返回的 JSON 解析成对象，不用再 <code>ConvertFrom-Json</code>）：</div>
          <pre class="tutorial-code">Invoke-RestMethod -Uri "http://localhost:8788/v1/chat/completions" `
  -Method Post `
  -Headers @{ Authorization = "Bearer sk-mock" } `
  -ContentType "application/json" `
  -Body '{"model":"gpt-3.5-turbo","messages":[{"role":"user","content":"测试"}]}'</pre>
          <div class="hint">HTTPS 模式下把 <code>http://</code> 换成 <code>https://</code>；自签证书场景 <code>curl.exe</code> 加 <code>-k</code> 跳过校验，<code>Invoke-RestMethod</code> 加 <code>-SkipCertificateCheck</code>。</div>
        </div>
        </div>
      </template>

      <!-- ===== models ===== -->
      <template x-if="tab==='models'">
        <div>
          <div class="card">
            <h2>Presets</h2>
            <div class="card-sub">一键套用到当前模型，仍需点「保存」写入生效</div>
            <div class="btns" style="flex-wrap:wrap">
              <template x-for="p in presets" :key="p.name">
                <button class="sm" @click="applyPreset(p.name)" x-text="p.name"></button>
              </template>
            </div>
          </div>

          <div class="card" x-show="sel">
            <h2>Model Configuration</h2>
            <div class="card-sub" x-text="sel ? sel.id : ''"></div>
            <div class="row"><label>模型名 id</label><input x-model="sel.id" /></div>
            <div class="row"><label>厂商</label>
              <div class="vendor-picker">
                <span class="vendor-icon" :class="sel.vendor" x-html="vendorIcon(sel.vendor)"></span>
                <select x-model="sel.vendor">
                  <template x-for="v in VENDOR_ORDER" :key="v">
                    <option :value="v" x-text="VENDOR_LABELS[v]"></option>
                  </template>
                </select>
              </div>
            </div>
            <div class="hint" style="margin:-4px 0 10px">决定协议格式（<span x-text="VENDOR_FORMAT_MAP[sel.vendor]"></span>），不确定选哪个厂商就用「自定义」——按你实际要模拟的协议选。</div>
            <div class="row"><label>回复内容</label><textarea x-model="sel.content"></textarea></div>
            <div class="hint" style="margin:-4px 0 10px">回复内容=实际返回的文本（原样，不截断）；「输出 token」只是<b>上报的计费数字</b>，与正文长度无关，互不影响。</div>
            <div class="row"><label>输入 token</label>
              <div class="grid2">
                <select x-model="sel.promptMode"><option value="auto">auto（按输入估算）</option><option value="fixed">fixed（固定）</option></select>
                <input type="number" x-model.number="sel.promptTokens" />
              </div>
            </div>
            <div class="row"><label>输出 token</label><input type="number" x-model.number="sel.completionTokens" /></div>
            <div class="row"><label>缓存命中</label>
              <div class="grid2">
                <select x-model="sel.cacheMode"><option value="none">none</option><option value="ratio">ratio（比例）</option><option value="fixed">fixed（固定）</option></select>
                <input type="number" step="0.05" x-model.number="sel.cacheRatio" x-show="sel.cacheMode==='ratio'" />
                <input type="number" x-model.number="sel.cachedTokens" x-show="sel.cacheMode==='fixed'" />
              </div>
            </div>
            <div class="row"><label>缓存写入(Claude)</label><input type="number" x-model.number="sel.cacheCreationTokens" /></div>
            <div class="row"><label>响应延迟 ms</label>
              <div class="grid2">
                <select x-model="sel.latencyMode"><option value="fixed">fixed（固定）</option><option value="range">range（范围随机）</option></select>
                <input type="number" x-model.number="sel.latencyMs" x-show="sel.latencyMode==='fixed'" />
              </div>
            </div>
            <div class="row" x-show="sel.latencyMode==='range'"><label>延迟范围 ms</label>
              <div class="grid2">
                <input type="number" x-model.number="sel.latencyMin" placeholder="最小" />
                <input type="number" x-model.number="sel.latencyMax" placeholder="最大" />
              </div>
            </div>
            <div class="row" x-show="sel.latencyMode==='range'"><label>分布</label>
              <select x-model="sel.latencyDist"><option value="uniform">均匀随机数</option><option value="normal">正态分布随机数</option></select>
            </div>
            <div class="hint" x-show="sel.latencyMode==='range'" style="margin:-4px 0 10px">均匀：区间内等概率；正态：以区间中点为均值、区间的六分之一为标准差，两端极小概率的尾部会被夹回区间内，不会溢出。每次请求都会重新采样一次延迟值，可以在「Recent Requests」里看实际用了多少 ms。</div>
            <div class="row"><label>流式块间隔 ms</label><input type="number" x-model.number="sel.chunkDelayMs" /></div>
            <div class="row"><label>注入错误码</label>
              <div class="grid2">
                <select x-model.number="sel.errorStatus"><option :value="0">不注入</option><option :value="400">400</option><option :value="401">401</option><option :value="403">403</option><option :value="429">429</option><option :value="500">500</option><option :value="503">503</option></select>
                <input type="number" min="0" max="100" x-model.number="sel.errorRate" title="触发概率 %" />
              </div>
            </div>
            <div class="row"><label>错误信息</label><input x-model="sel.errorMessage" /></div>
            <div class="btns"><button class="primary" @click="saveModel()">Save</button><button @click="openSaveAsPreset()">另存为预设</button></div>

            <div class="field-label">调用路径 — 本机本地</div>
            <div class="ep"><code x-text="endpointFor('http://localhost:' + port)"></code><button class="sm" @click="copy(endpointFor('http://localhost:' + port))">Copy</button></div>

            <div class="field-label">调用路径 — 本机 Docker</div>
            <div class="ep"><code x-text="endpointFor('http://host.docker.internal:' + port)"></code><button class="sm" @click="copy(endpointFor('http://host.docker.internal:' + port))">Copy</button></div>

            <div class="field-label">调用路径 — 局域网</div>
            <template x-for="ip in lanIps" :key="ip">
              <div class="ep"><code x-text="endpointFor('http://' + ip + ':' + port)"></code><button class="sm" @click="copy(endpointFor('http://' + ip + ':' + port))">Copy</button></div>
            </template>
            <div class="hint" x-show="!lanIps.length" style="margin:0">没探测到局域网网卡地址，可能只有回环网卡</div>

            <div class="field-label">调用路径 — 公网</div>
            <div class="ep"><code x-text="endpointFor('http://&lt;你的公网地址或域名&gt;:' + port)"></code></div>

            <div class="hint">容器场景记得选「本机 Docker」那条，不要给容器里的 new-api 填 localhost。</div>
          </div>
        </div>
      </template>

      <!-- ===== presets ===== -->
      <template x-if="tab==='presets'">
        <div class="card">
          <h2>Preset Management</h2>
          <div class="card-sub">自定义 / 编辑 / 删除</div>
          <div class="btns" style="flex-wrap:wrap; margin-bottom:10px; align-items:center">
            <template x-for="p in presets" :key="p.name">
              <span style="display:inline-flex; gap:4px; align-items:center; border:1px solid var(--border); border-radius:var(--radius); padding:2px 2px 2px 8px; font-size:11px">
                <button class="sm" style="border:none; background:transparent; padding:2px 4px" @click="editPreset(p)" x-text="p.name"></button>
                <button class="sm danger" style="border:none; background:transparent; padding:2px 6px" @click="delPreset(p.name)">×</button>
              </span>
            </template>
            <button class="sm primary" @click="newPreset()">+ New Preset</button>
          </div>

          <template x-if="editingPreset">
            <div style="border-top:1px solid var(--border); padding-top:12px">
              <div class="row"><label>预设名</label><input x-model="presetForm.name" placeholder="预设名称" /></div>
              <div class="row"><label>输入 token</label>
                <div class="grid2">
                  <select x-model="presetForm.promptMode"><option value="auto">auto</option><option value="fixed">fixed</option></select>
                  <input type="number" x-model.number="presetForm.promptTokens" />
                </div>
              </div>
              <div class="row"><label>输出 token</label><input type="number" x-model.number="presetForm.completionTokens" /></div>
              <div class="row"><label>缓存命中</label>
                <div class="grid2">
                  <select x-model="presetForm.cacheMode"><option value="none">none</option><option value="ratio">ratio</option><option value="fixed">fixed</option></select>
                  <input type="number" step="0.05" x-model.number="presetForm.cacheRatio" x-show="presetForm.cacheMode==='ratio'" />
                  <input type="number" x-model.number="presetForm.cachedTokens" x-show="presetForm.cacheMode==='fixed'" />
                </div>
              </div>
              <div class="row"><label>缓存写入(Claude)</label><input type="number" x-model.number="presetForm.cacheCreationTokens" /></div>
              <div class="row"><label>响应延迟 ms</label>
                <div class="grid2">
                  <select x-model="presetForm.latencyMode"><option value="fixed">fixed（固定）</option><option value="range">range（范围随机）</option></select>
                  <input type="number" x-model.number="presetForm.latencyMs" x-show="presetForm.latencyMode==='fixed'" />
                </div>
              </div>
              <div class="row" x-show="presetForm.latencyMode==='range'"><label>延迟范围 ms</label>
                <div class="grid2">
                  <input type="number" x-model.number="presetForm.latencyMin" placeholder="最小" />
                  <input type="number" x-model.number="presetForm.latencyMax" placeholder="最大" />
                </div>
              </div>
              <div class="row" x-show="presetForm.latencyMode==='range'"><label>分布</label>
                <select x-model="presetForm.latencyDist"><option value="uniform">均匀随机数</option><option value="normal">正态分布随机数</option></select>
              </div>
              <div class="row"><label>流式块间隔 ms</label><input type="number" x-model.number="presetForm.chunkDelayMs" /></div>
              <div class="row"><label>注入错误码</label>
                <div class="grid2">
                  <select x-model.number="presetForm.errorStatus"><option :value="0">不注入</option><option :value="400">400</option><option :value="401">401</option><option :value="403">403</option><option :value="429">429</option><option :value="500">500</option><option :value="503">503</option></select>
                  <input type="number" min="0" max="100" x-model.number="presetForm.errorRate" />
                </div>
              </div>
              <div class="row"><label>错误信息</label><input x-model="presetForm.errorMessage" /></div>
              <div class="btns"><button class="primary" @click="savePresetForm()">Save Preset</button><button @click="editingPreset=''">Cancel</button></div>
              <div class="hint">预设是完整行为快照（不含模型名/格式/回复内容），套用即得确定结果——只改你要的字段即可。</div>
            </div>
          </template>
        </div>
      </template>

      <!-- ===== channels ===== -->
      <template x-if="tab==='channels'">
        <div class="card">
          <h2>Channels（模拟多个上游渠道）</h2>
          <div class="card-sub">每个渠道有自己的 Base URL（<code>/ch/&lt;id&gt;</code>），配成 new-api 里不同的渠道，测权重/失败转移/限流这些跨渠道逻辑。不加 <code>/ch/</code> 前缀的原有请求路径完全不受影响。</div>
          <table>
            <thead><tr><th>Name</th><th>Enabled</th><th>Error Rate %</th><th>Extra Latency ms</th><th>Base URL</th><th></th></tr></thead>
            <tbody>
              <template x-for="c in channels" :key="c.id">
                <tr>
                  <td><input x-model="c.name" @change="saveChannel(c)" /></td>
                  <td style="text-align:center"><input type="checkbox" x-model="c.enabled" @change="saveChannel(c)" /></td>
                  <td><input type="number" min="0" max="100" x-model.number="c.errorRate" @change="saveChannel(c)" /></td>
                  <td><input type="number" x-model.number="c.extraLatencyMs" @change="saveChannel(c)" /></td>
                  <td>
                    <div style="display:flex; align-items:center; gap:6px">
                      <code x-text="origin + '/ch/' + c.id" style="white-space:nowrap"></code>
                      <button class="sm" @click="copy(origin + '/ch/' + c.id)">Copy</button>
                    </div>
                  </td>
                  <td><button class="sm danger" @click="delChannel(c.id)">Delete</button></td>
                </tr>
              </template>
              <tr x-show="!channels.length"><td colspan="6" style="color:var(--mut)">No channels</td></tr>
            </tbody>
          </table>
          <div class="btns" style="margin-top:10px"><button class="primary" @click="openNewChannelDialog()">+ New Channel</button></div>
          <div class="hint">Enabled 关掉、或者 Error Rate 拉高，都会让这个渠道下的所有请求直接失败（不管打的是哪个模型），配合 Extra Latency 一起可以模拟"渠道变慢 / 不稳定 / 整个挂掉"。字段改完失焦即保存。</div>
        </div>
      </template>

      <!-- ===== recent ===== -->
      <template x-if="tab==='recent'">
        <div class="card">
          <h2>Recent Requests</h2>
          <table><thead><tr><th>Time</th><th>Model</th><th>Fmt</th><th>Stream</th><th>Channel</th><th>Latency</th><th>Result</th></tr></thead>
            <tbody>
              <template x-for="(x,i) in recent" :key="i">
                <tr><td x-text="x.t"></td><td x-text="x.model"></td><td><span class="fmt" :class="x.format" x-text="x.format"></span></td>
                    <td x-text="x.stream?'yes':'—'"></td>
                    <td x-text="x.channel || '—'"></td>
                    <td x-text="x.latencyMs!=null ? x.latencyMs+'ms' : '—'"></td>
                    <td><span class="pill" :class="String(x.result).startsWith('ERR')?'err':'ok'" x-text="x.result"></span></td></tr>
              </template>
              <tr x-show="!recent.length"><td colspan="7" style="color:var(--mut)">No requests yet</td></tr>
            </tbody>
          </table>
        </div>
      </template>

      <!-- ===== network ===== -->
      <template x-if="tab==='network'">
        <div>
          <div class="card">
            <h2>Base URL</h2>
            <div class="card-sub">渠道 Base URL，按 new-api 部署位置选一条</div>

            <div class="field-label">本机本地</div>
            <div class="hint" style="margin:0 0 6px">new-api 和 mock 都不在容器里，同一台机器</div>
            <div class="ep"><code x-text="'http://localhost:' + port"></code><button class="sm" @click="copy('http://localhost:' + port)">Copy</button></div>

            <div class="field-label">本机 Docker</div>
            <div class="hint" style="margin:0 0 6px">new-api 在容器里，mock 在宿主机（或独立容器）</div>
            <div class="ep"><code x-text="'http://host.docker.internal:' + port"></code><button class="sm" @click="copy('http://host.docker.internal:' + port)">Copy</button></div>

            <div class="field-label">局域网</div>
            <div class="hint" style="margin:0 0 6px">同事 / new-api 在同一局域网或 VPN 内（自动探测网卡地址）</div>
            <template x-for="ip in lanIps" :key="ip">
              <div class="ep"><code x-text="'http://' + ip + ':' + port"></code><button class="sm" @click="copy('http://' + ip + ':' + port)">Copy</button></div>
            </template>
            <div class="hint" x-show="!lanIps.length" style="margin:0">没探测到局域网网卡地址，可能只有回环网卡</div>

            <div class="field-label">公网</div>
            <div class="hint" style="margin:0 0 6px">需要你自己做端口转发 / 反向代理，把下面换成真实公网地址或域名</div>
            <div class="ep"><code>http://&lt;你的公网地址或域名&gt;:<span x-text="port"></span></code></div>

            <div class="hint">new-api 建渠道时，「代理 / Base URL」填上面对应的一条；容器场景记得选「本机 Docker」那条，不要填 localhost。</div>
          </div>

          <div class="card">
            <h2>Trust Policy</h2>
            <div class="card-sub">局域网 / 公网信任策略，两条策略独立生效，互不覆盖</div>

            <div class="policy-card">
              <div class="policy-head"><b>Local Network</b><span class="policy-chip" :class="auth.lan.mode" x-text="modeLabel(auth.lan.mode)"></span></div>
              <div class="hint" style="margin-top:0">局域网/回环来源（127.*、10.*、172.16-31.*、192.168.*）套用这条策略。默认全开——办公室同事免登录直接用。</div>
              <div class="hint" style="margin-top:2px">改成 Deny All / Whitelist 前先确认已经设置密码——如果你现在是靠信任 IP 访问（没有登录 Session），保存后可能立刻要求你自己也重新登录，用密码登录一次即可找回控制台。</div>
              <div class="mode-switch">
                <template x-for="m in TRUST_MODES" :key="'lan-'+m">
                  <button :class="{active: authForm.lan.mode===m, [m]: authForm.lan.mode===m}" @click="authForm.lan.mode=m" x-text="modeLabel(m)"></button>
                </template>
              </div>
              <div class="row" x-show="authForm.lan.mode==='whitelist' || authForm.lan.mode==='blacklist'">
                <label>匹配规则(正则)</label>
                <input x-model="authForm.lan.list" placeholder="例如 ^192\.168\.1\." />
              </div>
              <div class="btns"><button class="primary" @click="saveLanPolicy()">Save Local Policy</button></div>
            </div>

            <div class="policy-card">
              <div class="policy-head"><b>Public Network</b><span class="policy-chip" :class="auth.public.mode" x-text="modeLabel(auth.public.mode)"></span></div>
              <div class="hint" style="margin-top:0">除局域网/回环外的所有来源（公网访客）套用这条策略。默认白名单且 0 条规则 = 一律要求密码登录，按需往里加。</div>
              <div class="mode-switch">
                <template x-for="m in TRUST_MODES" :key="'pub-'+m">
                  <button :class="{active: authForm.public.mode===m, [m]: authForm.public.mode===m}" @click="authForm.public.mode=m" x-text="modeLabel(m)"></button>
                </template>
              </div>
              <div class="row" x-show="authForm.public.mode==='whitelist' || authForm.public.mode==='blacklist'">
                <label>匹配规则(正则)</label>
                <input x-model="authForm.public.list" placeholder="例如 ^203\.0\.113\.9$" />
              </div>
              <div class="btns"><button class="primary" @click="savePublicPolicy()">Save Public Policy</button></div>
            </div>

            <div class="hint">
              反向代理场景下这里看到的来源 IP 可能是代理自己的地址，不是访客真实 IP——同事反馈"明明在公司网段还要登录"多半是这个原因，
              把代理的出口 IP / 网段写进 Public Network 的白名单规则里。
            </div>
          </div>

          <div class="card">
            <h2>Password</h2>
            <div class="card-sub" x-show="!auth.passwordSet">当前未设置，控制台完全开放（等同 Local / Public 策略都不生效）</div>
            <div class="card-sub" x-show="auth.passwordSet">已设置。留空「新密码」保存则不修改密码</div>
            <div class="row"><label>新密码</label><input type="password" x-model="authForm.password" placeholder="留空=不修改" autocomplete="new-password" /></div>
            <div class="btns"><button class="primary" @click="savePassword()">Save Password</button></div>
            <div class="hint">密码只经服务端 bcrypt 校验一次性传输，不写入 localStorage / Cookie 明文，浏览器也不缓存这个值。</div>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>

<div class="statusbar">
  <span class="seg"><span class="dot" :class="!auth.passwordSet ? 'warn' : (auth.trustedByIp ? 'info' : 'ok')"></span>
    <span x-text="!auth.passwordSet ? 'no auth' : (auth.trustedByIp ? 'trusted ip' : (auth.authenticated ? 'session' : 'locked'))"></span></span>
  <span class="seg" x-text="'port ' + port"></span>
  <span class="seg" x-text="models.length + ' models'"></span>
  <span class="seg">JetBrains Mono</span>
</div>

<div class="toast" :class="{show:toastMsg}" x-text="toastMsg" x-data="{}"></div>

<div class="confirm-overlay" x-show="confirmState.open" x-cloak @keydown.escape.window="resolveConfirm(false)">
  <div class="confirm-box">
    <div class="confirm-titlebar">Confirm</div>
    <div class="confirm-body" x-text="confirmState.message"></div>
    <div class="confirm-actions">
      <button @click="resolveConfirm(false)">Cancel</button>
      <button class="danger" @click="resolveConfirm(true)">Delete</button>
    </div>
  </div>
</div>

<div class="confirm-overlay" x-show="newModelState.open" x-cloak @keydown.escape.window="newModelState.open=false">
  <div class="confirm-box" style="width:360px">
    <div class="confirm-titlebar">New Model</div>
    <div class="confirm-body">
      <div class="row" style="grid-template-columns:64px 1fr">
        <label>厂商</label>
        <div class="vendor-picker">
          <span class="vendor-icon" :class="newModelState.vendor" x-html="vendorIcon(newModelState.vendor)"></span>
          <select x-model="newModelState.vendor">
            <template x-for="v in VENDOR_ORDER" :key="v">
              <option :value="v" x-text="VENDOR_LABELS[v]"></option>
            </template>
          </select>
        </div>
      </div>
      <div class="row" style="grid-template-columns:64px 1fr; margin-bottom:0">
        <label>名称</label>
        <input x-ref="newIdInput" x-model="newModelState.id" placeholder="例如 deepseek-v4-flash" @keydown.enter="confirmNewModel()" />
      </div>
    </div>
    <div class="confirm-actions">
      <button @click="newModelState.open=false">Cancel</button>
      <button class="primary" @click="confirmNewModel()">Create</button>
    </div>
  </div>
</div>

<div class="confirm-overlay" x-show="saveAsPresetState.open" x-cloak @keydown.escape.window="saveAsPresetState.open=false">
  <div class="confirm-box" style="width:360px">
    <div class="confirm-titlebar">另存为预设</div>
    <div class="confirm-body">
      <div class="row" style="grid-template-columns:64px 1fr; margin-bottom:0">
        <label>名称</label>
        <input x-ref="saveAsPresetInput" x-model="saveAsPresetState.name" placeholder="例如 我的场景" @keydown.enter="confirmSaveAsPreset()" />
      </div>
      <div class="hint" style="margin:8px 0 0">把当前模型的行为字段（token/缓存/延迟/错误…，不含模型名和回复内容）存成一个新预设，同名会覆盖。</div>
    </div>
    <div class="confirm-actions">
      <button @click="saveAsPresetState.open=false">Cancel</button>
      <button class="primary" @click="confirmSaveAsPreset()">Save</button>
    </div>
  </div>
</div>

<div class="confirm-overlay" x-show="newChannelState.open" x-cloak @keydown.escape.window="newChannelState.open=false">
  <div class="confirm-box" style="width:360px">
    <div class="confirm-titlebar">New Channel</div>
    <div class="confirm-body">
      <div class="row" style="grid-template-columns:64px 1fr; margin-bottom:0">
        <label>ID</label>
        <input x-ref="newChannelIdInput" x-model="newChannelState.id" placeholder="例如 backup-2" @keydown.enter="confirmNewChannel()" />
      </div>
      <div class="row" style="grid-template-columns:64px 1fr; margin-bottom:0; margin-top:9px">
        <label>名称</label>
        <input x-model="newChannelState.name" placeholder="例如 备用渠道 2" @keydown.enter="confirmNewChannel()" />
      </div>
      <div class="hint" style="margin-top:8px">ID 会出现在 Base URL 里（<code>/ch/&lt;id&gt;</code>），建议用英文/数字/短横线。</div>
    </div>
    <div class="confirm-actions">
      <button @click="newChannelState.open=false">Cancel</button>
      <button class="primary" @click="confirmNewChannel()">Create</button>
    </div>
  </div>
</div>

    },
    VENDOR_ICON_VB: { openai: "0 0 41 41" },
    vendorIcon(vendor) {
      const p = this.VENDOR_ICON_SVG[vendor];
      if (p) return '<svg viewBox="' + (this.VENDOR_ICON_VB[vendor] || "0 0 24 24") + '">' + p + '</svg>';
      return '<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="9" y="9" width="6" height="6" fill="currentColor"/></svg>';
    },
    newModelState: { open:false, vendor:"custom-openai", id:"" },
    saveAsPresetState: { open:false, name:"" },
    newChannelState: { open:false, id:"", name:"" },
    auth: { passwordSet:false, authenticated:false, trustedByIp:true,
            lan:{mode:"allow-all",list:null}, public:{mode:"whitelist",list:null} },
    authForm: { password:"", lan:{mode:"allow-all",list:""}, public:{mode:"whitelist",list:""} },
    async init() {
      await this.loadState();
      await this.loadAuthStatus();
      if (this.models.length) this.select(this.models[0].id);
      this.pollStats();
      this.runTypewriter();
      setInterval(() => this.pollStats(), 4000);
      window.addEventListener("keydown", (e) => {
        if (this.confirmState.open) return; // Escape 由 @keydown.escape.window 处理
        if (["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) return;
        const map = { "1":"tutorial", "2":"models", "3":"presets", "4":"channels", "5":"recent", "6":"network" };
        if (map[e.key]) this.tab = map[e.key];
      });
    },
    modeLabel(m) {
      return { "allow-all":"Allow All", "deny-all":"Deny All", "whitelist":"Whitelist", "blacklist":"Blacklist" }[m] || m;
    },
    async runTypewriter() {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        this.promptText = this.TERMINAL_COMMANDS[0];
        return;
      }
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      let i = 0;
      while (true) {
        const cmd = this.TERMINAL_COMMANDS[i % this.TERMINAL_COMMANDS.length];
        for (let c = 1; c <= cmd.length; c++) { this.promptText = cmd.slice(0, c); await sleep(38); }
        await sleep(1300);
        for (let c = cmd.length; c >= 0; c--) { this.promptText = cmd.slice(0, c); await sleep(22); }
        await sleep(300);
        i++;
      }
    },
    groupedModels() {
      const q = this.modelSearch.trim().toLowerCase();
      const filtered = q ? this.models.filter(m => m.id.toLowerCase().includes(q)) : this.models;
      const groups = {};
      filtered.forEach(m => { (groups[m.vendor] ||= []).push(m); });
      const keys = [...this.VENDOR_ORDER.filter(k => groups[k]), ...Object.keys(groups).filter(k => !this.VENDOR_ORDER.includes(k))];
      return keys.map(k => ({ vendor: k, format: this.VENDOR_FORMAT_MAP[k] || "openai", items: groups[k] }));
    },
    toggleGroup(fmt) { this.collapsedGroups[fmt] = !this.collapsedGroups[fmt]; },
    askConfirm(message) {
      return new Promise((resolve) => { this.confirmState = { open:true, message, resolveFn: resolve }; });
    },
    resolveConfirm(v) {
      const fn = this.confirmState.resolveFn;
      this.confirmState = { open:false, message:"", resolveFn:null };
      if (fn) fn(v);
    },
    async loadState() {
      const r = await fetch("/__state"); const s = await r.json();
      // enabled 在库里是 0/1(SQLite 没 boolean)，Alpine 的 checkbox x-model 要真布尔值才会显示勾上，这里转一下；
      // 存回去的时候 store.js 的 normalizeChannel 会把 true/false 自动转回 1/0，不用在 saveChannel 里特地转。
      this.models = s.models; this.presets = s.presets; this.channels = (s.channels || []).map(c => ({ ...c, enabled: !!c.enabled })); this.port = s.port; this.lanIps = s.lanIps || [];
      if (this.sel) { const still = this.models.find(m => m.id === this.sel.id); this.sel = still ? JSON.parse(JSON.stringify(still)) : (this.models[0] ? JSON.parse(JSON.stringify(this.models[0])) : null); }
    },
    async loadAuthStatus() {
      const r = await fetch("/__auth/status"); const s = await r.json();
      this.auth = s;
      this.authForm.lan = { mode: s.lan.mode, list: s.lan.list || "" };
      this.authForm.public = { mode: s.public.mode, list: s.public.list || "" };
    },
    select(id) { const m = this.models.find(x => x.id === id); this.sel = m ? JSON.parse(JSON.stringify(m)) : null; },
    toast(msg, ok=true) { this.toastMsg = msg; setTimeout(() => this.toastMsg = "", 1600); },
    async saveModel() {
      const r = await fetch("/__models", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(this.sel) });
      if (r.ok) { const {model} = await r.json(); await this.loadState(); this.select(model.id); this.toast("已保存并生效"); }
      else this.toast("保存失败", false);
    },
    openSaveAsPreset() {
      if (!this.sel) return;
      this.saveAsPresetState = { open:true, name:"" };
      this.$nextTick(() => this.$refs.saveAsPresetInput && this.$refs.saveAsPresetInput.focus());
    },
    async confirmSaveAsPreset() {
      const name = this.saveAsPresetState.name.trim();
      if (!name) { this.toast("请输入预设名称", false); return; }
      // /__presets 只会从 patch 里挑行为字段(id/vendor/format/content 会被自动忽略)，整个 sel 丢过去就行
      await fetch("/__presets", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ name, patch: this.sel }) });
      this.saveAsPresetState.open = false;
      await this.loadState(); this.toast("已存为预设「" + name + "」");
    },
    async saveChannel(c) {
      await fetch("/__channels", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(c) });
      await this.loadState();
    },
    async delChannel(id) {
      const ok = await this.askConfirm("Delete channel \"" + id + "\"? This cannot be undone.");
      if (!ok) return;
      await fetch("/__channels/" + encodeURIComponent(id), { method:"DELETE" });
      await this.loadState(); this.toast("已删除渠道");
    },
    openNewChannelDialog() {
      this.newChannelState = { open:true, id:"", name:"" };
      this.$nextTick(() => this.$refs.newChannelIdInput && this.$refs.newChannelIdInput.focus());
    },
    async confirmNewChannel() {
      const id = this.newChannelState.id.trim();
      if (!id) { this.toast("请输入渠道 ID", false); return; }
      const name = this.newChannelState.name.trim() || id;
      await fetch("/__channels", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ id, name }) });
      this.newChannelState.open = false;
      await this.loadState(); this.toast("已新建渠道");
    },
    openNewModelDialog() {
      this.newModelState = { open:true, vendor:"custom-openai", id:"" };
      this.$nextTick(() => this.$refs.newIdInput && this.$refs.newIdInput.focus());
    },
    async confirmNewModel() {
      const id = this.newModelState.id.trim();
      if (!id) { this.toast("请输入模型名称", false); return; }
      const base = { id, vendor: this.newModelState.vendor, content:"mock 回复",
        promptMode:"auto", promptTokens:100, completionTokens:30, cacheMode:"none", cacheRatio:0.5,
        cachedTokens:0, cacheCreationTokens:0, latencyMs:0, chunkDelayMs:40, errorStatus:0, errorRate:0, errorMessage:"mock injected error" };
      await fetch("/__models", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(base) });
      this.newModelState.open = false;
      await this.loadState(); this.select(base.id); this.toast("已新建模型");
    },
    async dupModel() {
      if (!this.sel) return;
      const copy = JSON.parse(JSON.stringify(this.sel)); copy.id = this.sel.id + "-copy";
      await fetch("/__models", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(copy) });
      await this.loadState(); this.select(copy.id); this.toast("已复制");
    },
    async delModel() {
      if (!this.sel) return;
      const ok = await this.askConfirm("Delete model \"" + this.sel.id + "\"? This cannot be undone.");
      if (!ok) return;
      await fetch("/__models/" + encodeURIComponent(this.sel.id), { method:"DELETE" });
      this.sel = null; await this.loadState(); if (this.models.length) this.select(this.models[0].id); this.toast("已删除");
    },
    async applyPreset(name) {
      if (!this.sel) return;
      await fetch("/__models", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(this.sel) });
      const r = await fetch("/__models/" + encodeURIComponent(this.sel.id) + "/apply-preset", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ name }) });
      if (r.ok) { const {model} = await r.json(); await this.loadState(); this.select(model.id); this.toast("已套用预设「" + name + "」"); }
      else this.toast("套用失败", false);
    },
    async pollStats() { const r = await fetch("/__stats"); this.recent = (await r.json()).recent; },
    presetDefaults() {
      return { promptMode:"auto", promptTokens:100, completionTokens:30, cacheMode:"none", cacheRatio:0.5,
        cachedTokens:0, cacheCreationTokens:0, latencyMs:0, latencyMode:"fixed", latencyMin:0, latencyMax:0, latencyDist:"uniform",
        chunkDelayMs:40, errorStatus:0, errorRate:0, errorMessage:"mock injected error" };
    },
    newPreset() { this.editingPreset = "__new__"; this.presetForm = { name:"", ...this.presetDefaults() }; },
    editPreset(p) { this.editingPreset = p.name; this.presetForm = { name:p.name, ...this.presetDefaults(), ...p.patch }; },
    async savePresetForm() {
      const { name, ...patch } = this.presetForm;
      if (!String(name || "").trim()) { this.toast("请填预设名", false); return; }
      await fetch("/__presets", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ name, patch }) });
      this.editingPreset = ""; await this.loadState(); this.toast("预设已保存");
    },
    async delPreset(name) {
      const ok = await this.askConfirm("Delete preset \"" + name + "\"? This cannot be undone.");
      if (!ok) return;
      await fetch("/__presets/" + encodeURIComponent(name), { method:"DELETE" });
      if (this.editingPreset === name) this.editingPreset = "";
      await this.loadState(); this.toast("预设已删除");
    },
    endpointFor(base) {
      if (!this.sel) return "";
      const fmt = this.VENDOR_FORMAT_MAP[this.sel.vendor] || "openai";
      if (fmt === "openai") return "POST " + base + "/v1/chat/completions";
      if (fmt === "claude") return "POST " + base + "/v1/messages";
      return "POST " + base + "/v1beta/models/" + this.sel.id + ":generateContent";
    },
    copy(t) { navigator.clipboard?.writeText(t); this.toast("已复制"); },
    async savePassword() {
      if (!this.authForm.password) { this.toast("请输入新密码", false); return; }
      const r = await fetch("/__auth/config", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ password: this.authForm.password }) });
      if (r.ok) { this.authForm.password = ""; await this.loadAuthStatus(); this.toast("密码已保存"); }
      else this.toast("保存失败", false);
    },
    async saveLanPolicy() {
      const r = await fetch("/__auth/config", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ lan: { mode: this.authForm.lan.mode, list: this.authForm.lan.list } }) });
      if (r.ok) { await this.loadAuthStatus(); this.toast("局域网策略已保存"); }
      else this.toast("保存失败", false);
    },
    async savePublicPolicy() {
      const r = await fetch("/__auth/config", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ public: { mode: this.authForm.public.mode, list: this.authForm.public.list } }) });
      if (r.ok) { await this.loadAuthStatus(); this.toast("公网策略已保存"); }
      else this.toast("保存失败", false);
    },
    async logout() {
      await fetch("/__auth/logout", { method:"POST" });
      location.href = "/";
    },
  };
}
</script>
</body>
</html>
